<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Page Not Found - Anime Jigsaw Puzzle: Cozy Time</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf6f0;
            color: #5c4033;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 2px solid #f3d5cd;
        }
        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #d9777f;
            margin: 0;
            line-height: 1;
        }
        h1 {
            font-size: 1.4rem;
            margin: 15px 0 10px;
            color: #5c4033;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #7f5539;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 25px;
            background-color: #d9777f;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(217, 119, 127, 0.3);
        }
        .btn-home:hover {
            background-color: #c0636b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Oops, This Puzzle Piece Is Missing!</h1>
        <p>The page or redirect destination you are looking for cannot be found, is broken, or has expired.</p>
    </div>

    <script>
        // Optional: Dynamic error message handling based on URL parameters (e.g., error.html?code=invalid)
        const urlParams = new URLSearchParams(window.location.search);
        const errorCode = urlParams.get('code');
        
        if (errorCode === 'expired') {
            document.querySelector("h1").innerText = "Link Expired";
            document.querySelector("p").innerText = "Sorry, this link or report request is no longer active.";
        }
    </script>

</body>
</html>
